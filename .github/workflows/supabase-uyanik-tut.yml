# Supabase'in ücretsiz planı, bir hafta kullanılmayan projeyi uykuya alır.
# Bu iş her 3 günde bir veritabanından küçük bir okuma yaparak panelin hep açık kalmasını sağlar.
name: Supabase uyanık tut
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Veritabanına küçük bir istek gönder
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://ncjisnkgqdhjefdgghwy.supabase.co/rest/v1/site_content?select=key&limit=1" \
            -H "apikey: sb_publishable_4qotW4Ljqt6KvRbpi9mccA_WV-y3iz2")
          echo "Supabase yanıtı: $code"
          test "$code" = "200"
