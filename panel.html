<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel | Şevval Çikot</title>
  <meta name="description" content="Şevval Çikot kişisel web sitesi yönetim paneli ve kişisel asistan ajandası.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#04273b">
  <link rel="icon" href="assets/images/avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/panel.css">
</head>
<body>
  <div class="deep-bg" aria-hidden="true"></div>

  <!-- giriş -->
  <main class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <img src="assets/images/avatar.jpg" alt="" class="login-avatar">
      <h1>Panel</h1>
      <p class="muted">Site içeriği ve kişisel ajanda. Devam etmek için giriş yap.</p>
      <label>E-posta<input type="email" name="email" autocomplete="username" required></label>
      <label>Şifre<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Giriş yap</button>
      <p class="form-error" id="login-error" role="alert"></p>
      <a href="index.html" class="muted small">← Siteye dön</a>
    </form>
  </main>

  <!-- uygulama -->
  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <a href="index.html" class="side-brand"><img src="assets/images/avatar.jpg" alt=""><span>Şevval'in Paneli</span></a>
      <nav aria-label="Panel">
        <p class="side-label">Kişisel asistan</p>
        <button data-view="today" class="active"><i>☀︎</i>Bugün</button>
        <button data-view="calendar"><i>▦</i>Takvim</button>
        <button data-view="tasks"><i>✓</i>Görevler</button>
        <button data-view="notes"><i>✎</i>Notlar</button>
        <button data-view="focus"><i>◷</i>Odak</button>
        <button data-view="assistant"><i>✦</i>Asistan</button>
        <p class="side-label">Site içeriği (CMS)</p>
        <button data-view="projects"><i>◫</i>Projeler</button>
        <button data-view="gallery"><i>▣</i>Galeri</button>
        <button data-view="about"><i>¶</i>Hakkımda</button>
        <button data-view="skills"><i>%</i>Yetenekler ve ilgi</button>
        <button data-view="quote"><i>❝</i>Söz</button>
      </nav>
      <div class="side-foot">
        <span class="mode" id="mode"></span>
        <a href="index.html" target="_blank" rel="noopener">Siteyi aç ↗</a>
        <button id="logout" type="button">Çıkış yap</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu" id="menu" type="button" aria-label="Menü" aria-expanded="false">☰</button>
        <h1 id="view-title">Bugün</h1>
        <span class="clock" id="clock"></span>
      </header>
      <div class="demo-banner" id="demo-banner" hidden>
        <strong>Demo modu:</strong> Supabase henüz bağlı değil, veriler yalnızca bu tarayıcıda saklanıyor.
        Kurulum için <code>KURULUM.txt</code> dosyasına bak.
      </div>
      <section class="view" id="view" aria-live="polite"></section>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <dialog class="modal" id="modal"><form method="dialog" class="modal-inner" id="modal-form"></form></dialog>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/assistant.js"></script>
  <script src="assets/js/panel.js"></script>
</body>
</html>
